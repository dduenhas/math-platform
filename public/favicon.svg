<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Blueprint Dark Background -->
  <rect width="64" height="64" rx="12" fill="#051022" />
  
  <!-- Subtle Blueprint Grid Lines -->
  <line x1="0" y1="16" x2="64" y2="16" stroke="#0e294b" stroke-width="0.75" />
  <line x1="0" y1="32" x2="64" y2="32" stroke="#1d4ed8" stroke-width="0.75" stroke-dasharray="2,2" />
  <line x1="0" y1="48" x2="64" y2="48" stroke="#0e294b" stroke-width="0.75" />
  <line x1="16" y1="0" x2="16" y2="64" stroke="#0e294b" stroke-width="0.75" />
  <line x1="32" y1="0" x2="32" y2="64" stroke="#1d4ed8" stroke-width="0.75" stroke-dasharray="2,2" />
  <line x1="48" y1="0" x2="48" y2="64" stroke="#0e294b" stroke-width="0.75" />

  <!-- Main Coordinate Axes -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#38bdf8" stroke-width="1.2" />
  <line x1="32" y1="8" x2="32" y2="56" stroke="#38bdf8" stroke-width="1.2" />

  <!-- Unit Trigonometric Circle (radius = 22, center = 32,32) -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#e2e8f0" stroke-width="1.8" />

  <!-- Angle ~35 deg: cos(35)*22 ≈ 18, sin(35)*22 ≈ 12.6 -> Target: (32+18, 32-12.6) = (50, 19.4) -->
  <!-- Right Triangle: Cateto Adjacente (Cosseno - Coral/Cyan) -->
  <line x1="32" y1="32" x2="50" y2="32" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <!-- Cateto Oposto (Seno - Rosa Carmim) -->
  <line x1="50" y1="32" x2="50" y2="19.4" stroke="#f43f5e" stroke-width="2.2" stroke-linecap="round" />
  <!-- Hipotenusa (Raio = 1.0) -->
  <line x1="32" y1="32" x2="50" y2="19.4" stroke="#ffffff" stroke-width="1.8" />

  <!-- Right Angle Symbol -->
  <path d="M 46 32 L 46 28 L 50 28" fill="none" stroke="#94a3b8" stroke-width="0.8" />

  <!-- Golden Yellow Orbiting Dot (O Ponto Amarelo Polar P) -->
  <circle cx="50" cy="19.4" r="3.8" fill="#fbbf24" stroke="#ffffff" stroke-width="1.2" />
  <!-- Pulsing Amber Core -->
  <circle cx="50" cy="19.4" r="1.8" fill="#f59e0b" />

  <!-- Origin Dot -->
  <circle cx="32" cy="32" r="1.5" fill="#38bdf8" />
</svg>
